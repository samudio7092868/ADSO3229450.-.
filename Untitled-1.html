<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ CSS SELECTOR DASH (+5 PTS)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    body {
      background: #090014;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .game-card {
      background: #12002b;
      padding: 20px;
      border-radius: 28px;
      box-shadow: 0 0 35px #00f0ff;
      max-width: 480px;
      width: 100%;
      border: 4px solid #00f0ff;
      text-align: center;
    }

    /* PUNTOS (+5) Y RACHA */
    .hud {
      display: flex;
      justify-content: space-between;
      background: #000000;
      padding: 12px 20px;
      border-radius: 18px;
      margin-bottom: 15px;
      border: 2px solid #ff007f;
      font-size: 1.3rem;
    }

    .score { color: #ffe600; }
    .streak { color: #00f0ff; }

    /* VISTA DE ELEMENTOS CSS EN PANTALLA */
    .code-box {
      background: #1a003b;
      border-radius: 20px;
      padding: 15px;
      margin-bottom: 15px;
      border: 3px dashed #ff007f;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .target-selector {
      font-size: 1.6rem;
      color: #00f0ff;
      text-shadow: 0 0 10px #00f0ff;
      background: #000;
      padding: 6px 16px;
      border-radius: 12px;
      border: 1px solid #00f0ff;
    }

    /* REPRESENTACIÓN DE LISTA DE ELEMENTOS HTML */
    .elements-preview {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 5px;
    }

    .element-item {
      background: #2a005c;
      border: 2px solid #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 1.1rem;
      color: #fff;
    }

    /* OPCIONES ABC */
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-abc {
      background: #25004a;
      color: #ffffff;
      border: 3px solid #00f0ff;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 6px 0 #0088cc;
      transition: transform 0.1s;
    }

    .btn-abc:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0088cc;
    }

    .badge {
      background: #ff007f;
      color: #ffffff;
      width: 45px;
      height: 45px;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.6rem;
      flex-shrink: 0;
      border: 2px solid #fff;
      box-shadow: 0 0 10px #ff007f;
    }

    .btn-restart {
      background: #00ff66;
      color: #000;
      border-color: #fff;
      justify-content: center;
      box-shadow: 0 6px 0 #00aa44;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="hud">
      <div class="score">⚡ PTS: <span id="score">0</span></div>
      <div class="streak">🔥 RACHA: <span id="streak">0</span></div>
    </div>

    <div class="code-box">
      <div class="target-selector" id="selectorDisplay">:first-child</div>
      <div class="elements-preview" id="elementsPreview"></div>
    </div>

    <div class="options-container" id="optionsContainer"></div>
  </div>

  <script>
    let score = 0;
    let streak = 0;
    let currentLevel = 0;

    // Desafíos centrados en first-child, last-child y nth-child
    const challenges = [
      {
        selector: ".item:first-child",
        items: ["📦 1", "📦 2", "📦 3", "📦 4"],
        options: [
          { label: "Selecciona '📦 1'", correct: true },
          { label: "Selecciona '📦 4'", correct: false },
          { label: "Selecciona todos", correct: false }
        ]
      },
      {
        selector: ".item:last-child",
        items: ["🍎 1", "🍌 2", "🍇 3"],
        options: [
          { label: "Selecciona '🍎 1'", correct: false },
          { label: "Selecciona '🍇 3'", correct: true },
          { label: "Selecciona '🍌 2'", correct: false }
        ]
      },
      {
        selector: ".item:nth-child(even)",
        items: ["🔴 1", "🔵 2", "🔴 3", "🔵 4"],
        options: [
          { label: "Selecciona los Impares (1, 3)", correct: false },
          { label: "Selecciona el Primero (1)", correct: false },
          { label: "Selecciona los Pares (2, 4)", correct: true }
        ]
      },
      {
        selector: ".item:nth-child(3)",
        items: ["⭐ 1", "⭐ 2", "⭐ 3", "⭐ 4"],
        options: [
          { label: "Selecciona '⭐ 3'", correct: true },
          { label: "Selecciona '⭐ 1'", correct: false },
          { label: "Selecciona '⭐ 4'", correct: false }
        ]
      },
      {
        selector: ".item:nth-child(odd)",
        items: ["🐱 1", "🐶 2", "🐱 3", "🐶 4"],
        options: [
          { label: "Selecciona los Pares (2, 4)", correct: false },
          { label: "Selecciona los Impares (1, 3)", correct: true },
          { label: "Selecciona el Último (4)", correct: false }
        ]
      }
    ];

    function loadChallenge() {
      const c = challenges[currentLevel];
      
      document.getElementById('selectorDisplay').innerText = c.selector;
      
      const previewContainer = document.getElementById('elementsPreview');
      previewContainer.innerHTML = '';
      
      c.items.forEach(item => {
        const span = document.createElement('span');
        span.className = 'element-item';
        span.innerText = item;
        previewContainer.appendChild(span);
      });

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      const letters = ["A", "B", "C"];

      c.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn-abc';
        btn.innerHTML = `
          <div class="badge">${letters[index]}</div>
          <div style="flex-grow:1; text-align:center;">${opt.label}</div>
        `;
        btn.onclick = () => selectOption(opt.correct);
        container.appendChild(btn);
      });
    }

    function selectOption(isCorrect) {
      if (isCorrect) {
        // Incremento explícito de +5 puntos por respuesta correcta
        score += 5;
        streak++;
      } else {
        streak = 0;
      }

      document.getElementById('score').innerText = score;
      document.getElementById('streak').innerText = streak;

      currentLevel++;

      if (currentLevel < challenges.length) {
        loadChallenge();
      } else {
        showWinScreen();
      }
    }

    function showWinScreen() {
      document.getElementById('selectorDisplay').innerText = "🏆 ¡EXPERTO EN CSS!";
      document.getElementById('elementsPreview').innerHTML = "<span class='element-item'>🎉 Nivel Completado 🎉</span>";

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      const restartBtn = document.createElement('button');
      restartBtn.className = 'btn-abc btn-restart';
      restartBtn.innerHTML = `🔥 JUGAR DE NUEVO`;
      restartBtn.onclick = resetGame;
      container.appendChild(restartBtn);
    }

    function resetGame() {
      score = 0;
      streak = 0;
      currentLevel = 0;
      document.getElementById('score').innerText = score;
      document.getElementById('streak').innerText = streak;
      loadChallenge();
    }

    loadChallenge();
  </script>

</body>
</html>
