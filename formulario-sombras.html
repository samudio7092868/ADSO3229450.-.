<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Psicodélico Absoluto</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* CONTENEDOR 3D DE ALTA PERSPECTIVA */
    .ultra-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 400px;
      overflow: hidden;
    }

    /* CAPA 1: TUNEL DE BARS OPTIC-ART (MOIRÉ EXTREMO) */
    .moire-bg {
      position: absolute;
      width: 350vw;
      height: 350vh;
      background: repeating-conic-gradient(
        from 0deg,
        #000 0deg 2deg,
        #fff 2deg 4deg,
        #ff0000 4deg 6deg,
        #00ffff 6deg 8deg,
        #000 8deg 10deg,
        #ff00ff 10deg 12deg
      );
      animation: spinMoire 1.5s linear infinite;
      mix-blend-mode: difference;
      opacity: 0.95;
    }

    /* CAPA 2: VÓRTICE CÓNICO SECUNDARIO EN CONTRA-ROTACIÓN */
    .moire-bg-2 {
      position: absolute;
      width: 300vw;
      height: 300vh;
      background: repeating-radial-gradient(
        circle,
        #fff 0px 10px,
        #000 10px 20px,
        #00ff00 20px 30px,
        #ff0055 30px 40px
      );
      animation: zoomTunnel 0.8s linear infinite alternate;
      mix-blend-mode: exclusion;
    }

    /* CAPA 3: MATRIZ DE FORMAS EN MULTI-EJE 3D */
    .ultra-core {
      position: relative;
      width: 700px;
      height: 700px;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      mix-blend-mode: difference;
    }

    .shape {
      position: absolute;
      mix-blend-mode: difference;
      box-shadow: 0 0 30px currentColor;
    }

    /* CAPA EXTRA: GEOMETRÍA SAGRADA EN DEFORMACIÓN */
    .shape-1 {
      width: 650px;
      height: 650px;
      background: conic-gradient(from 0deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
      clip-path: polygon(50% 0%, 80% 10%, 100% 35%, 100% 70%, 80% 90%, 50% 100%, 20% 90%, 0% 70%, 0% 35%, 20% 10%);
      animation: rotateChaos1 2s linear infinite, morphShape 1.2s ease-in-out infinite alternate;
    }

    .shape-2 {
      width: 520px;
      height: 520px;
      border: 25px repeating-linear-gradient(90deg, #fff 0 15px, #000 15px 30px);
      background: repeating-radial-gradient(circle, #ff0055 0 20px, #00f0ff 20px 40px);
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
      animation: rotateChaos2 1.4s linear infinite;
    }

    .shape-3 {
      width: 400px;
      height: 400px;
      border: 15px dashed #00ff00;
      border-radius: 50%;
      animation: pulseZ 0.6s ease-in-out infinite alternate;
    }

    .shape-4 {
      width: 280px;
      height: 280px;
      background: #ffff00;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: rotateChaos1 0.7s linear infinite reverse;
    }

    .shape-5 {
      width: 160px;
      height: 160px;
      background: #ff00ff;
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      animation: rotateChaos2 0.4s linear infinite;
    }

    /* OJO DEL DIABLO / PUNTO DE FIJACIÓN ESTROBOSCÓPICO */
    .strobe-eye {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      z-index: 200;
      box-shadow: 0 0 40px #fff, 0 0 80px #ff0000, 0 0 120px #00ffff;
      animation: strobeFast 0.08s infinite alternate;
    }

    /* ANIMACIONES ULTRA RÁPIDAS DE MAREO OPTICO */
    @keyframes spinMoire {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.4); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes zoomTunnel {
      0% { transform: scale(0.8) rotate(0deg); }
      100% { transform: scale(1.6) rotate(-180deg); }
    }

    @keyframes rotateChaos1 {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      100% { transform: rotateX(360deg) rotateY(180deg) rotateZ(360deg); }
    }

    @keyframes rotateChaos2 {
      0% { transform: rotateX(360deg) rotateY(0deg) rotateZ(0deg); }
      100% { transform: rotateX(0deg) rotateY(360deg) rotateZ(-360deg); }
    }

    @keyframes pulseZ {
      0% { transform: translateZ(-200px) scale(0.5); }
      100% { transform: translateZ(200px) scale(1.5); }
    }

    @keyframes morphShape {
      0% { border-radius: 0%; }
      100% { border-radius: 50%; }
    }

    @keyframes strobeFast {
      0% { background: #ffffff; transform: scale(0.8); }
      100% { background: #ff0000; transform: scale(2.2); }
    }
  </style>
</head>
<body>

  <div class="ultra-stage">
    <!-- Capas de interferencia tipo Moiré -->
    <div class="moire-bg"></div>
    <div class="moire-bg-2"></div>

    <!-- Core multidimensional -->
    <div class="ultra-core">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
      <div class="shape shape-5"></div>

      <!-- Punto estroboscópico central -->
      <div class="strobe-eye"></div>
    </div>
  </div>

</body>
</html>
